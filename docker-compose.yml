services:
  payment_db:
    image: postgres:18-alpine
    container_name: payment_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-admin}
      POSTGRES_DB: ${DB_NAME:-payment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres_data_payment:/var/lib/postgresql

  analytics_db:
    image: postgres:18-alpine
    container_name: analytics_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-admin}
      POSTGRES_DB: ${DB_NAME:-analytics}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
    volumes:
      - ./data/postgres_data_analytics:/var/lib/postgresql

  redis:
    image: redis:8.6-alpine
    container_name: redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      # Параметры для KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'

      # Настройка разных слушателей
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9094:9094"
    volumes:
      - ./data/kafka_data:/var/lib/kafka/data

  payment_service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment_app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      payment_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - DB_HOST=payment_db
      - DB_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS_HOST=kafka
      - KAFKA_BOOTSTRAP_SERVERS_PORT=9092
      - PROVIDER_HOST=provider_app
      - PROVIDER_PORT=8000
    env_file:
      - ./payment-service/.env
    ports:
      - "8000:8000"

  provider-service:
    build:
      context: .
      dockerfile: provider-service/Dockerfile
    container_name: provider_app
    ports:
      - "7000:8000"

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: analytics_app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      analytics_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=analytics_db
      - DB_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS_HOST=kafka
      - KAFKA_BOOTSTRAP_SERVERS_PORT=9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./payment-service/.env
    ports:
      - "9000:8000"

volumes:
  postgres_data_payment:
  postgres_data_analytics:
  kafka_data: